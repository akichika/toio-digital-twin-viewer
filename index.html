<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>toio Digital Twin Viewer</title>
  <meta name="description" content="A digital twin viewer & RC remote for toio Core Cube — real-time 2D/3D position, heading and LED, keyboard & on-screen control, multi-cube, trajectory drawing.">
  <meta name="theme-color" content="#0078FF">
  <link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1">

  <script src="js/i18n.js?v=1"></script>
  <script defer src="js/vendor/three.min.js"></script>
  <script defer src="js/vendor/OrbitControls.js"></script>
  <script defer src="js/toio.js?v=1"></script>
  <script defer src="js/twin.js?v=1"></script>
  <script defer src="js/control.js?v=1"></script>
  <script defer src="js/app.js?v=1"></script>
</head>
<body>
<div id="app">

  <!-- ─── Header ──────────────────────────────────────────────────────── -->
  <header id="header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" stroke="white" stroke-width="2"/><circle cx="9" cy="9" r="3.5" fill="white"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-title" data-i18n="app.title"></span>
        <span class="brand-sub" data-i18n="app.subtitle"></span>
      </span>
    </div>

    <div class="header-actions">
      <button id="btn-connect" class="btn btn-primary" data-i18n="ui.connect"></button>
      <button id="btn-demo" class="btn" data-i18n="ui.addDemo"></button>
      <button id="btn-install" class="btn" hidden data-i18n="ui.install"></button>
      <select id="lang-select" class="sel" title="Language" data-i18n-title="ui.lang">
        <option value="ja">日本語</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
      </select>
      <button id="btn-theme" class="btn icon" title="Theme">☀</button>
      <button id="btn-about" class="btn icon" data-i18n-title="ui.about" aria-label="About">ⓘ</button>
    </div>
  </header>

  <!-- ─── Main ────────────────────────────────────────────────────────── -->
  <main id="main">

    <!-- Stage: the digital-twin view -->
    <section id="stage">
      <div class="view-toolbar">
        <div class="seg">
          <button class="view-btn active" data-view="2d" data-i18n="ui.view2d"></button>
          <button class="view-btn" data-view="3d" data-i18n="ui.view3d"></button>
        </div>
        <label class="mat-label"><span data-i18n="ui.mat"></span>
          <select id="mat-select" class="sel">
            <option value="simple" data-i18n="ui.matSimple"></option>
            <option value="original" data-i18n="ui.matOriginal"></option>
          </select>
        </label>
        <span class="spacer"></span>
        <button id="btn-clear-trail" class="btn small" data-i18n="ui.clearTrail"></button>
        <button id="btn-fullscreen" class="btn small icon" data-i18n-title="ui.fullscreen" aria-label="Fullscreen">⛶</button>
      </div>
      <div class="view-area">
        <canvas id="twin-2d"></canvas>
        <div id="twin-3d" style="display:none"></div>
      </div>
    </section>

    <!-- Control panel -->
    <aside id="panel">
      <!-- Cubes -->
      <div class="panel-block">
        <h2 data-i18n="ui.cubes"></h2>
        <div id="cube-list"></div>
      </div>

      <!-- Remote control -->
      <div class="panel-block">
        <h2 data-i18n="ui.remote"></h2>

        <div class="ctl-row">
          <span class="ctl-label" data-i18n="ui.target"></span>
          <div id="target-chips" class="chips"></div>
        </div>

        <div class="ctl-row">
          <span class="ctl-label" data-i18n="ui.speed"></span>
          <input id="speed" class="slider" type="range" min="10" max="115" value="50">
          <span id="speed-val" class="ctl-val">50</span>
        </div>

        <!-- D-pad -->
        <div class="dpad">
          <button id="pad-fwd"   class="pad" data-i18n-title="ui.forward">▲</button>
          <button id="pad-left"  class="pad" data-i18n-title="ui.turnLeft">◀</button>
          <button id="pad-stop"  class="pad stop" data-i18n-title="ui.stop">■</button>
          <button id="pad-right" class="pad" data-i18n-title="ui.turnRight">▶</button>
          <button id="pad-back"  class="pad" data-i18n-title="ui.back">▼</button>
        </div>

        <div class="ctl-row spins">
          <button id="btn-spin-l" class="btn small"><span data-i18n="ui.turnLeft"></span> 90°</button>
          <button id="btn-spin-r" class="btn small">90° <span data-i18n="ui.turnRight"></span></button>
        </div>

        <!-- LED -->
        <div class="ctl-group">
          <span class="ctl-label" data-i18n="ui.led"></span>
          <div class="led-grid">
            <button class="led-btn" data-rgb="255,0,0"   style="--lc:#ff3b3b" data-i18n-title="color.red"></button>
            <button class="led-btn" data-rgb="0,255,0"   style="--lc:#22c55e" data-i18n-title="color.green"></button>
            <button class="led-btn" data-rgb="0,0,255"   style="--lc:#3b6bff" data-i18n-title="color.blue"></button>
            <button class="led-btn" data-rgb="255,255,0" style="--lc:#f5d90a" data-i18n-title="color.yellow"></button>
            <button class="led-btn" data-rgb="0,255,255" style="--lc:#22d3ee" data-i18n-title="color.cyan"></button>
            <button class="led-btn" data-rgb="255,0,255" style="--lc:#e879f9" data-i18n-title="color.pink"></button>
            <button class="led-btn" data-rgb="255,255,255" style="--lc:#ffffff" data-i18n-title="color.white"></button>
            <button class="led-btn off" data-rgb="0,0,0" data-i18n-title="color.off">✕</button>
          </div>
        </div>

        <!-- Sound -->
        <div class="ctl-group">
          <span class="ctl-label" data-i18n="ui.sound"></span>
          <div class="snd-grid">
            <button class="snd-btn" data-snd="0" data-i18n="sound.enter"></button>
            <button class="snd-btn" data-snd="1" data-i18n="sound.select"></button>
            <button class="snd-btn" data-snd="5" data-i18n="sound.item"></button>
            <button class="snd-btn" data-snd="6" data-i18n="sound.score"></button>
            <button class="snd-btn" data-snd="7" data-i18n="sound.error"></button>
          </div>
        </div>

        <p class="hint" data-i18n="ui.keyboardHint"></p>
      </div>
    </aside>
  </main>

  <footer id="statusbar"><span id="status"></span></footer>
</div>

<!-- About dialog -->
<dialog id="about-dialog" class="dialog">
  <h3 data-i18n="about.title"></h3>
  <p data-i18n="about.desc"></p>
  <p class="tag-line"><strong data-i18n="about.fanMade"></strong></p>
  <p class="small" data-i18n="about.disclaimer"></p>
  <p class="small" data-i18n="about.oss"></p>
  <div class="dialog-links">
    <a href="https://github.com/akichika/toio-digital-twin-viewer" target="_blank" rel="noopener" data-i18n="about.github"></a>
    <a href="https://toio.io" target="_blank" rel="noopener" data-i18n="about.official"></a>
  </div>
  <div class="dialog-actions"><button id="about-close" class="btn btn-primary" data-i18n="about.close"></button></div>
</dialog>

</body>
</html>
